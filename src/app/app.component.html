<ion-app>
  <ion-split-pane contentId="main-content" [when]="router.url !== '/login' && router.url !== '/' && router.url !== '/not-found' ? '(min-width: 1024px)' : false">
  <ion-menu contentId="main-content" [disabled]="router.url === '/login' || router.url === '/' || router.url === '/not-found'" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>CLIDENT</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <nav aria-label="Navegación principal">
      <ion-list lines="none">
        <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages">
          <ion-item [routerLink]="p.url" routerDirection="root" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" detail="false">
            <ion-icon slot="start" [name]="p.icon" aria-hidden="true"></ion-icon>
            <ion-label>{{ p.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
      <ion-menu-toggle auto-hide="false" *ngIf="auth.user()?.role === 'ADMINISTRADOR'"><ion-item routerLink="/administracion" routerLinkActive="selected" detail="false"><ion-icon slot="start" name="shield-checkmark" aria-hidden="true"></ion-icon><ion-label>Administración</ion-label></ion-item></ion-menu-toggle>
      </nav>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
  </ion-split-pane>
  <div *ngIf="ui.pending()" class="operation-progress" role="status"><ion-spinner name="dots"></ion-spinner><span>Procesando solicitud</span></div>
  <div *ngIf="ui.message()" class="operation-message" [class.operation-error]="ui.error()" role="status"><span>{{ ui.message() }}</span><button type="button" aria-label="Cerrar mensaje" (click)="ui.message.set('')">Cerrar</button></div>
</ion-app>
