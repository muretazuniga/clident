<ion-header>

  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir menú"></ion-menu-button>

      <ion-back-button defaultHref="/home" text="Volver">
      </ion-back-button>

    </ion-buttons>

    <ion-title>
      Mis datos
    </ion-title>

  </ion-toolbar>

</ion-header>


<ion-content class="ion-padding">
  <div class="page-shell profile-shell">

  <ion-card>

    <ion-card-header>

      <ion-card-title>
        Foto de perfil
      </ion-card-title>

      <ion-card-subtitle>
        Selecciona una foto para tu perfil
      </ion-card-subtitle>

    </ion-card-header>


    <ion-card-content>


      <!-- SELECTOR DE FOTO -->
      <input
        #selectorFoto
        type="file"
        accept="image/*"
        (change)="seleccionarFoto($event)"
        style="display: none;"
      >


      <!-- BOTÓN GALERÍA -->
      <ion-button
        expand="block"
        (click)="selectorFoto.click()">

        Elegir foto de galería

      </ion-button>


      <!-- ELIMINAR FOTO -->
      <ion-button
        expand="block"
        color="danger"
        fill="outline"
        (click)="limpiarFoto()"
        [disabled]="!fotoBase64">

        Eliminar foto

      </ion-button>


      <!-- FOTO -->
      <div
        *ngIf="fotoBase64"
        class="profile-photo"
        @zoomFade>

        <ion-img
          alt="Foto de perfil"
          [src]="fotoBase64">
        </ion-img>

      </div>


      <!-- SIN FOTO -->
      <ion-text
        color="medium"
        *ngIf="!fotoBase64">

        <p>
          No hay foto de perfil seleccionada.
        </p>

      </ion-text>


    </ion-card-content>

  </ion-card>

  </div>
</ion-content>
